name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $versionLine = Select-String -Path millennium.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if (-not $versionLine -or $env:RELEASE_TAG -ne "v$($versionLine.Matches[0].Groups[1].Value)") {
            throw "Tag $env:RELEASE_TAG must match the version in millennium.toml."
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check:types

      - name: Build
        run: bun run build

      - name: Verify plugin package
        run: bun run verify

      - name: Test
        run: bun test

      - name: Save release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: steam-status-studio-release
          path: |
            dist/com.steamstatusstudio.live.star
            dist/SteamStatusRunner.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: steam-status-studio-release
          path: dist

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @('dist/com.steamstatusstudio.live.star', 'dist/SteamStatusRunner.exe')
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing build artifact: $asset" }
          }

          $releaseJson = gh release view $env:RELEASE_TAG --json assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            # A rerun must repair stale or partially uploaded assets for this tag.
            gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
